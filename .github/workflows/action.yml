# This workflow is managed by gh actions-lock.

name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: read-all
jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
